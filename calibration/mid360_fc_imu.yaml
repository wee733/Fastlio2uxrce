laser_mapping:
  ros__parameters:
    common:
      lid_topic: /livox/lidar
      imu_topic: /lio/imu
    preprocess:
      lidar_type: 1
      feature_extract_en: false
      scan_line: 4
      blind: 1.0
    initialization:
      cut_frame_num: 5
      orig_odom_freq: 10
      mean_acc_norm: 9.805
      online_refine_time: 20.0
      data_accum_length: 500.0
      Rot_LI_cov:
      - 5.0e-05
      - 5.0e-05
      - 5.0e-05
      Trans_LI_cov:
      - 1.0e-05
      - 1.0e-05
      - 1.0e-05
    mapping:
      filter_size_surf: 0.1
      filter_size_map: 0.2
      gyr_cov: 2.0
      acc_cov: 2.0
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      det_range: 100.0
    publish:
      path_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: false
    pcd_save:
      pcd_save_en: false
      interval: -1
    point_filter_num: 2
    max_iteration: 5
    cube_side_length: 2000.0

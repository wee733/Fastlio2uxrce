# Tested with linuxptp v3.1.1. Livox MID360 does not support PTP 2.1.
# Serve the host clock to the LiDAR; never discipline the host clock here.
[global]
network_transport UDPv4
delay_mechanism E2E
time_stamping software
free_running 1
masterOnly 1
domainNumber 0
logSyncInterval -3
logAnnounceInterval 0
uds_address /var/run/ptp4l-lio-audit
